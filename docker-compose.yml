services:
  inference:
    build: .
    environment:
      STRIPPED_PLOVER_HOST: stripped-plover
      STRIPPED_PLOVER_PORT: "4020"
    volumes:
      # Mount the model file from the host to the container
      # This file is expected to exist at runtime.
      - ./lm.binary:/app/lm.binary:ro
    # The default command can be overridden by the user
    # e.g., docker-compose run inference "some input string"
    ports:
      - "3000:3000"
    restart: unless-stopped
  stripped-plover:
    build:
      context: .
      dockerfile: Dockerfile.stripped-plover
    environment:
      STRIPPED_PLOVER_DB: /data/stripped-plover.sqlite
      STRIPPED_PLOVER_PORT: "4020"
    volumes:
      - stripped-plover-data:/data
    ports:
      - "4020:4020"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net');const s=net.connect(4020,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
  train:
    build:
      context: .
      target: train
    volumes:
      # Mount the data directory (corpus input) and repo root (artifacts output)
      - ./data:/app/data
      - ./lm.binary:/app/lm.binary
    # Override with: docker compose run --rm train bash train_lm.sh
  practice-android:
    build:
      context: .
      dockerfile: Dockerfile.practice-android
    volumes:
      - ./android-artifacts:/workspace/artifacts
    command: ["sleep", "infinity"]
  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
    environment:
      V7_INFERENCE_URL: http://inference:3000/infer
      V7_TRAINER_DB: /data/trainer.sqlite3
    volumes:
      - trainer-data:/data
    ports:
      - "3001:3001"
    depends_on:
      inference:
        condition: service_healthy
    restart: unless-stopped
  evaluator-sandbox:
    image: v7-evaluator-sandbox:latest
    build:
      context: .
      dockerfile: evaluation-server/sandbox.Dockerfile
    command: ["/bin/true"]
  evaluator-model:
    image: v7-evaluator-sandbox:latest
    user: "0:0"
    volumes:
      - ./lm.binary:/model-source/lm.binary:ro
      - evaluator-model:/model
    command:
      [
        "/bin/sh",
        "-c",
        "cp /model-source/lm.binary /model/lm.binary && chmod 0444 /model/lm.binary",
      ]
    depends_on:
      evaluator-sandbox:
        condition: service_completed_successfully
  evaluation-server:
    build:
      context: .
      dockerfile: evaluation-server/server.Dockerfile
    environment:
      EVALUATION_PORT: "3002"
      EVALUATION_SANDBOX_IMAGE: v7-evaluator-sandbox:latest
      EVALUATION_MODEL_VOLUME: v7-evaluator-model
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3002:3002"
    depends_on:
      evaluator-model:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  stripped-plover-data:
  trainer-data:
  evaluator-model:
    name: v7-evaluator-model
