version: '3.8'
services:
  inference:
    build: .
    environment:
      STRIPPED_PLOVER_HOST: stripped-plover
      STRIPPED_PLOVER_PORT: "4020"
    volumes:
      # Mount the model file from the host to the container
      # This file is expected to exist at runtime.
      - ./lm.binary:/app/lm.binary:ro
      - ./generated_regexes.json:/app/generated_regexes.json:ro
      - ./static:/app/static:ro
    # The default command can be overridden by the user
    # e.g., docker-compose run inference "some input string"
    ports:
      - "3000:3000"
  stripped-plover:
    build:
      context: .
      dockerfile: Dockerfile.stripped-plover
    environment:
      STRIPPED_PLOVER_DB: /data/stripped-plover.sqlite
      STRIPPED_PLOVER_PORT: "4020"
    volumes:
      - stripped-plover-data:/data
    ports:
      - "4020:4020"

volumes:
  stripped-plover-data:
