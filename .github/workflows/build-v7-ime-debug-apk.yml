name: Build V7 IME Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      LITERT_LM_BAZEL_ROOT: ${{ runner.temp }}/v7-litert-lm-bazel
    defaults:
      run:
        working-directory: ime-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk for native LiteRT-LM
        run: |
          docker system prune --all --force
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install WebUI dependencies
        working-directory: .
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: v7-ime-debug-apk
          path: ime-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
