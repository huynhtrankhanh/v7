<svg width="850" height="500" viewBox="0 0 850 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #333; text-anchor: middle; }
      .bit-dot { r: 10; stroke: #888; stroke-width: 1; fill: #FFF; }
      .bit-active-tone { fill: #AEC6CF; stroke: #7986CB; }
      .bit-active-vowel { fill: #77DD77; stroke: #66BB6A; }
      .group-box { fill: #F9F9F9; rx: 10; ry: 10; stroke: #EEE; stroke-width: 1; }
      .sub-label { font-size: 10px; fill: #888; text-anchor: middle; }
    </style>
  </defs>

  <text x="210" y="30" class="label" style="font-size: 20px;">V7 Tones (Mirrored Patterns)</text>
  <text x="640" y="30" class="label" style="font-size: 20px;">V7 Vowels (Flipped L Shape)</text>

  <!-- Tones Grid (Left hand patterns) -->
  <g transform="translate(20, 50)">
    <g transform="translate(0, 0)">
      <rect width="180" height="70" class="group-box"/>
      <text x="90" y="25" class="label">Ngang (0)</text>
      <circle cx="60" cy="50" class="bit-dot" />
      <circle cx="90" cy="50" class="bit-dot" />
      <circle cx="120" cy="50" class="bit-dot" />
    </g>
    <g transform="translate(190, 0)">
      <rect width="180" height="70" class="group-box"/>
      <text x="90" y="25" class="label">Sắc (1)</text>
      <circle cx="60" cy="50" class="bit-dot bit-active-tone" />
      <circle cx="90" cy="50" class="bit-dot" />
      <circle cx="120" cy="50" class="bit-dot" />
    </g>
    <g transform="translate(0, 80)">
      <rect width="180" height="70" class="group-box"/>
      <text x="90" y="25" class="label">Huyền (2)</text>
      <circle cx="60" cy="50" class="bit-dot" />
      <circle cx="90" cy="50" class="bit-dot bit-active-tone" />
      <circle cx="120" cy="50" class="bit-dot" />
    </g>
    <g transform="translate(190, 80)">
      <rect width="180" height="70" class="group-box"/>
      <text x="90" y="25" class="label">Ngã (4)</text>
      <circle cx="60" cy="50" class="bit-dot bit-active-tone" />
      <circle cx="90" cy="50" class="bit-dot bit-active-tone" />
      <circle cx="120" cy="50" class="bit-dot" />
    </g>
    <g transform="translate(0, 160)">
      <rect width="180" height="70" class="group-box"/>
      <text x="90" y="25" class="label">Hỏi (3)</text>
      <circle cx="60" cy="50" class="bit-dot" />
      <circle cx="90" cy="50" class="bit-dot" />
      <circle cx="120" cy="50" class="bit-dot bit-active-tone" />
    </g>
    <g transform="translate(190, 160)">
      <rect width="180" height="70" class="group-box"/>
      <text x="90" y="25" class="label">Sắc Stop (6)</text>
      <circle cx="60" cy="50" class="bit-dot bit-active-tone" />
      <circle cx="90" cy="50" class="bit-dot" />
      <circle cx="120" cy="50" class="bit-dot bit-active-tone" />
    </g>
    <g transform="translate(0, 240)">
      <rect width="180" height="70" class="group-box"/>
      <text x="90" y="25" class="label">Nặng (5)</text>
      <circle cx="60" cy="50" class="bit-dot" />
      <circle cx="90" cy="50" class="bit-dot bit-active-tone" />
      <circle cx="120" cy="50" class="bit-dot bit-active-tone" />
    </g>
    <g transform="translate(190, 240)">
      <rect width="180" height="70" class="group-box"/>
      <text x="90" y="25" class="label">Nặng Stop (7)</text>
      <circle cx="60" cy="50" class="bit-dot bit-active-tone" />
      <circle cx="90" cy="50" class="bit-dot bit-active-tone" />
      <circle cx="120" cy="50" class="bit-dot bit-active-tone" />
    </g>
    <text x="180" y="330" class="sub-label">Tone Keys: K, W, R (Left) / -G, -B, -R (Right)</text>
  </g>

  <!-- Vowels Grid (Horizontally Flipped L Shape) -->
  <!-- Left Hand Layout (Bitmask Sum):
       Top: -D (Suffix)
       Base: A (bit 1), O (bit 2)
  -->
  <g transform="translate(450, 50)">
    <!-- a (1) -->
    <g transform="translate(0, 0)">
      <rect width="180" height="90" class="group-box"/>
      <text x="90" y="25" class="label">a (1)</text>
      <circle cx="110" cy="45" class="bit-dot" /><!-- -D -->
      <circle cx="70" cy="70" class="bit-dot bit-active-vowel" /><!-- A -->
      <circle cx="110" cy="70" class="bit-dot" /><!-- O -->
    </g>
    <!-- o (2) -->
    <g transform="translate(190, 0)">
      <rect width="180" height="90" class="group-box"/>
      <text x="90" y="25" class="label">o (2)</text>
      <circle cx="110" cy="45" class="bit-dot" />
      <circle cx="70" cy="70" class="bit-dot" />
      <circle cx="110" cy="70" class="bit-dot bit-active-vowel" /><!-- O -->
    </g>
    <!-- i (3) -->
    <g transform="translate(0, 100)">
      <rect width="180" height="90" class="group-box"/>
      <text x="90" y="25" class="label">i (3)</text>
      <circle cx="110" cy="45" class="bit-dot" />
      <circle cx="70" cy="70" class="bit-dot bit-active-vowel" /><!-- A -->
      <circle cx="110" cy="70" class="bit-dot bit-active-vowel" /><!-- O -->
    </g>
    <!-- e (0) -->
    <g transform="translate(190, 100)">
      <rect width="180" height="90" class="group-box"/>
      <text x="90" y="25" class="label">e (0)</text>
      <circle cx="110" cy="45" class="bit-dot" />
      <circle cx="70" cy="70" class="bit-dot" />
      <circle cx="110" cy="70" class="bit-dot" />
    </g>
    <!-- u (0 + Suffix) -->
    <g transform="translate(95, 200)">
      <rect width="180" height="90" class="group-box" style="fill: #E8F5E9;"/>
      <text x="90" y="25" class="label">u (0 + -D/-Z)</text>
      <circle cx="110" cy="45" class="bit-dot bit-active-vowel" /><!-- -D/-Z -->
      <circle cx="70" cy="70" class="bit-dot" />
      <circle cx="110" cy="70" class="bit-dot" />
    </g>
    
    <text x="180" y="320" class="sub-label">Vowel Layout (Left Hand): Top=-D, Left=A, Right=O</text>
    <text x="180" y="335" class="sub-label">Vowel Layout (Right Hand): Top=-Z, Left=E, Right=U</text>
  </g>

  <text x="425" y="450" class="label" style="font-size: 14px; font-weight: normal; fill: #666;">
    Vowel patterns use A, O, -D (Left) or mirror equivalents E, U, -Z (Right).
  </text>
</svg>