<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #333; text-anchor: middle; }
      .bit-dot { r: 8; stroke: #888; stroke-width: 1; fill: #FFF; }
      .bit-active-tone { fill: #AEC6CF; stroke: #7986CB; }
      .bit-active-vowel { fill: #77DD77; stroke: #66BB6A; }
      .bit-active-suffix { fill: #B5EAD7; stroke: #4DB6AC; }
      .group-box { fill: #F9F9F9; rx: 10; ry: 10; stroke: #EEE; stroke-width: 1; }
    </style>
  </defs>

  <text x="200" y="30" class="label" style="font-size: 20px;">V7 Tones (Mirrored)</text>
  <text x="600" y="30" class="label" style="font-size: 20px;">V7 Vowels (Mirrored)</text>

  <!-- Tones Grid -->
  <g transform="translate(20, 50)">
    <g transform="translate(0, 0)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">Ngang (0)</text>
      <circle cx="65" cy="40" class="bit-dot" />
      <circle cx="85" cy="40" class="bit-dot" />
      <circle cx="105" cy="40" class="bit-dot" />
    </g>
    <g transform="translate(180, 0)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">Sắc (1)</text>
      <circle cx="65" cy="40" class="bit-dot bit-active-tone" />
      <circle cx="85" cy="40" class="bit-dot" />
      <circle cx="105" cy="40" class="bit-dot" />
    </g>
    <g transform="translate(0, 70)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">Huyền (2)</text>
      <circle cx="65" cy="40" class="bit-dot" />
      <circle cx="85" cy="40" class="bit-dot bit-active-tone" />
      <circle cx="105" cy="40" class="bit-dot" />
    </g>
    <g transform="translate(180, 70)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">Ngã (4)</text>
      <circle cx="65" cy="40" class="bit-dot bit-active-tone" />
      <circle cx="85" cy="40" class="bit-dot bit-active-tone" />
      <circle cx="105" cy="40" class="bit-dot" />
    </g>
    <g transform="translate(0, 140)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">Hỏi (3)</text>
      <circle cx="65" cy="40" class="bit-dot" />
      <circle cx="85" cy="40" class="bit-dot" />
      <circle cx="105" cy="40" class="bit-dot bit-active-tone" />
    </g>
    <g transform="translate(180, 140)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">Sắc Stop (6)</text>
      <circle cx="65" cy="40" class="bit-dot bit-active-tone" />
      <circle cx="85" cy="40" class="bit-dot" />
      <circle cx="105" cy="40" class="bit-dot bit-active-tone" />
    </g>
    <g transform="translate(0, 210)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">Nặng (5)</text>
      <circle cx="65" cy="40" class="bit-dot" />
      <circle cx="85" cy="40" class="bit-dot bit-active-tone" />
      <circle cx="105" cy="40" class="bit-dot bit-active-tone" />
    </g>
    <g transform="translate(180, 210)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">Nặng Stop (7)</text>
      <circle cx="65" cy="40" class="bit-dot bit-active-tone" />
      <circle cx="85" cy="40" class="bit-dot bit-active-tone" />
      <circle cx="105" cy="40" class="bit-dot bit-active-tone" />
    </g>
  </g>

  <!-- Vowels Grid -->
  <g transform="translate(420, 50)">
    <g transform="translate(0, 0)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">a (1)</text>
      <circle cx="75" cy="40" class="bit-dot bit-active-vowel" />
      <circle cx="95" cy="40" class="bit-dot" />
    </g>
    <g transform="translate(180, 0)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">o (2)</text>
      <circle cx="75" cy="40" class="bit-dot" />
      <circle cx="95" cy="40" class="bit-dot bit-active-vowel" />
    </g>
    <g transform="translate(0, 70)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">i (3)</text>
      <circle cx="75" cy="40" class="bit-dot bit-active-vowel" />
      <circle cx="95" cy="40" class="bit-dot bit-active-vowel" />
    </g>
    <g transform="translate(180, 70)">
      <rect width="170" height="60" class="group-box"/>
      <text x="85" y="20" class="label">e (0, No Suffix)</text>
      <circle cx="75" cy="40" class="bit-dot" />
      <circle cx="95" cy="40" class="bit-dot" />
      <!-- Suffix dot shown small/empty -->
      <circle cx="115" cy="40" r="4" fill="none" stroke="#CCC"/>
    </g>
    <g transform="translate(90, 140)">
      <rect width="170" height="60" class="group-box" style="fill: #E8F5E9;"/>
      <text x="85" y="20" class="label">u (0 + Suffix)</text>
      <circle cx="65" cy="40" class="bit-dot" />
      <circle cx="85" cy="40" class="bit-dot" />
      <circle cx="105" cy="40" class="bit-dot bit-active-suffix" /><!-- -D or -Z -->
      <text x="85" y="55" class="bit-label" style="font-size: 8px;">Suffix: -D (Left) / -Z (Right)</text>
    </g>
  </g>
  
  <text x="400" y="380" class="label" style="font-size: 14px; font-weight: normal; fill: #666;">
    Vowels: a, o, i use bit combinations of A/O (Left) or U/E (Right).
  </text>
  <text x="400" y="400" class="label" style="font-size: 14px; font-weight: normal; fill: #666;">
    Disambiguation: If no vowel keys are pressed, default is 'e'. Press -D (Left) or -Z (Right) for 'u'.
  </text>
</svg>