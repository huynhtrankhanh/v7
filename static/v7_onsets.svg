<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #333; text-anchor: middle; }
      .bit-dot { r: 8; stroke: #888; stroke-width: 1; fill: #FFF; }
      .bit-active { fill: #FFB7B2; stroke: #E57373; }
      .bit-label { font-size: 10px; fill: #666; text-anchor: middle; }
      .group-box { fill: #F9F9F9; rx: 10; ry: 10; stroke: #EEE; stroke-width: 1; }
    </style>
  </defs>
  
  <text x="400" y="30" class="label" style="font-size: 24px;">V7 Consonant Bitmasks (Mirrored)</text>
  <text x="400" y="55" class="label" style="font-size: 14px; fill: #666;">Dots represent keys: 1(#/-T), 2(S/-S), 4(T/-L), 8(P/-P), 16(H/-F)</text>

  <!-- Macro to generate a consonant block -->
  <!-- We'll programmatically generate the content below in the tool logic? No, must write full SVG here. -->
  <!-- I will manually layout the grid based on my knowledge of the map. -->
  
  <!-- Grid layout: 6 columns, ~4 rows. -->
  <!-- Col width: 130. Row height: 100. -->
  
  <!-- b (11 = 1+2+8) -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="120" height="80" class="group-box"/>
    <text x="60" y="25" class="label">b</text>
    <!-- Bits: 1, 2, 4, 8, 16. Layout: 1(TopL), 4(TopM), 8(TopR), 16(TopFarR)? No. -->
    <!-- Left Hand layout: # (Q), T (W), P (E), H (R) [Top Row] -->
    <!--                   S (A) [Home Row] -->
    <!-- Let's visualize relative positions roughly -->
    <circle cx="20" cy="45" class="bit-dot bit-active" /><!-- 1 (#) -->
    <circle cx="45" cy="45" class="bit-dot" /><!-- 4 (T) -->
    <circle cx="70" cy="45" class="bit-dot bit-active" /><!-- 8 (P) -->
    <circle cx="95" cy="45" class="bit-dot" /><!-- 16 (H) -->
    <circle cx="30" cy="65" class="bit-dot bit-active" /><!-- 2 (S) -->
  </g>

