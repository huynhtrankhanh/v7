plugins {
    id "com.android.application"
}

def suppliedVersionName = providers.gradleProperty("v7PracticeVersion").orElse("1.0.0").get()
def suppliedVersionCode = providers.gradleProperty("v7PracticeVersionCode")
    .orElse(suppliedVersionName.replaceAll("[^0-9]", "").take(8))
    .get()
if (suppliedVersionCode == "") {
    suppliedVersionCode = "1"
}

android {
    namespace "com.huynhtrankhanh.v7practice"
    compileSdk 35

    defaultConfig {
        applicationId "com.huynhtrankhanh.v7practice"
        minSdk 23
        targetSdk 35
        versionCode suppliedVersionCode.toInteger()
        versionName suppliedVersionName
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("SIGNING_STORE_FILE") ?: "${buildDir}/derived-signing/v7-practice.p12")
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: ""
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "v7-practice"
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: ""
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

tasks.register("copyPracticeHtml", Copy) {
    from rootProject.file("../static/practice.html")
    into layout.projectDirectory.dir("src/main/assets")
}

preBuild.dependsOn("copyPracticeHtml")
