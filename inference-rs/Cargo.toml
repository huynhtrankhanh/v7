[package]
name = "inference-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
unicode-normalization = "0.1"
libc = "0.2"
clap = { version = "4.0", features = ["derive"] }
regex = "1.10"

[build-dependencies]
cc = "1.0"