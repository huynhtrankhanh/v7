plugins { id "com.android.application" }

def suppliedVersionName = providers.gradleProperty("v7ImeVersion")
        .orElse("1.0.0")
        .get()
def suppliedVersionCode = providers.gradleProperty("v7ImeVersionCode")
        .orElse(suppliedVersionName.replaceAll("[^0-9]", "").take(8))
        .get()
if (suppliedVersionCode == "") {
    suppliedVersionCode = "1"
}
def suppliedSigningStore = System.getenv("SIGNING_STORE_FILE")

android {
    namespace "com.huynhtrankhanh.v7ime"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.huynhtrankhanh.v7ime"
        minSdk 26
        targetSdk 35
        versionCode suppliedVersionCode.toInteger()
        versionName suppliedVersionName
    }

    sourceSets {
        main {
            assets.srcDir layout.buildDirectory.dir("generated/v7WebUi")
            assets.srcDir layout.buildDirectory.dir(
                    "generated/strippedPloverWeb"
            )
            assets.srcDir layout.buildDirectory.dir("generated/sourceArchive")
            jniLibs.srcDir layout.buildDirectory.dir("generated/nativeJniLibs")
        }
    }

    signingConfigs {
        release {
            storeFile file(
                    suppliedSigningStore
                            ?: "${buildDir}/missing-v7-ime-release-key.p12"
            )
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: ""
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "v7-ime"
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: ""
            storeType System.getenv("SIGNING_STORE_TYPE") ?: "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

def webRoot = rootProject.file("..")
def generatedWebAssets = layout.buildDirectory.dir("generated/v7WebUi")
def generatedStrippedPloverAssets = layout.buildDirectory.dir(
        "generated/strippedPloverWeb"
)
def kenlmRoot = layout.buildDirectory.dir("kenlm")
def strippedPloverRoot = layout.buildDirectory.dir("stripped-plover")
def strippedPloverTypecheck = layout.buildDirectory.dir(
        "stripped-plover-android-typecheck"
)
def generatedNativeLibraries = layout.buildDirectory.dir("generated/nativeJniLibs")
def cargoTargetDirectory = layout.buildDirectory.dir("rust-target")
def generatedSourceArchive = layout.buildDirectory.file(
        "generated/sourceArchive/v7-ime-source.zip"
)
tasks.register("buildWebUi", Exec) {
    workingDir webRoot
    commandLine "npm", "run", "build"
    inputs.files(
            fileTree("${webRoot}/src") { include "**/*.ts" },
            "${webRoot}/static/index.html",
            "${webRoot}/static/dictionary.html",
            "${webRoot}/static/ime.html",
            "${webRoot}/static/ime.css",
            "${webRoot}/static/plover-dictionary.css",
            "${webRoot}/package.json",
            "${webRoot}/package-lock.json",
            "${webRoot}/vite.config.ts"
    )
    outputs.file "${webRoot}/static/script.js"
}

tasks.register("syncWebUi", Sync) {
    dependsOn "buildWebUi"
    from("${webRoot}/static") {
        include "index.html"
        include "dictionary.html"
        include "ime.html"
        include "ime.css"
        include "plover-dictionary.css"
        include "script.js"
    }
    into generatedWebAssets
}

tasks.register("prepareKenlm", Exec) {
    commandLine(
            rootProject.file("scripts/prepare-kenlm.sh"),
            kenlmRoot.get().asFile,
            rootProject.file("KENLM_REVISION")
    )
    inputs.files(
            rootProject.file("KENLM_REVISION"),
            rootProject.file("scripts/prepare-kenlm.sh"),
            rootProject.file("patches/kenlm-load-from-fd.patch")
    )
    outputs.dir kenlmRoot
}

tasks.register("prepareStrippedPlover", Exec) {
    commandLine(
            rootProject.file("scripts/prepare-stripped-plover.sh"),
            strippedPloverRoot.get().asFile,
            rootProject.file("STRIPPED_PLOVER_REVISION")
    )
    inputs.files(
            rootProject.file("STRIPPED_PLOVER_REVISION"),
            rootProject.file("scripts/prepare-stripped-plover.sh")
    )
    outputs.dir strippedPloverRoot
}

tasks.register("installStrippedPloverBuildDependencies", Exec) {
    dependsOn "prepareStrippedPlover"
    workingDir strippedPloverRoot
    commandLine "npm", "ci", "--ignore-scripts"
    inputs.files(
            strippedPloverRoot.map { it.file("package.json") },
            strippedPloverRoot.map { it.file("package-lock.json") }
    )
    outputs.dir strippedPloverRoot.map { it.dir("node_modules") }
}

tasks.register("buildStrippedPloverWeb", Exec) {
    dependsOn "installStrippedPloverBuildDependencies"
    workingDir webRoot
    commandLine(
            rootProject.file("scripts/build-stripped-plover-web.mjs"),
            strippedPloverRoot.get().asFile,
            rootProject.file("stripped-plover-web"),
            generatedStrippedPloverAssets.get().asFile,
            strippedPloverTypecheck.get().asFile
    )
    inputs.files(
            fileTree(strippedPloverRoot) {
                exclude ".git/**"
                exclude "node_modules/**"
                exclude "dist/**"
                exclude "**/*.test.ts"
            },
            fileTree(rootProject.file("stripped-plover-web")),
            rootProject.file("scripts/build-stripped-plover-web.mjs"),
            rootProject.file("STRIPPED_PLOVER_REVISION")
    )
    outputs.dir generatedStrippedPloverAssets
}

tasks.register("buildNativeInference", Exec) {
    dependsOn "prepareKenlm"
    commandLine(
            rootProject.file("scripts/build-native.sh"),
            webRoot,
            kenlmRoot.get().asFile,
            generatedNativeLibraries.get().asFile,
            cargoTargetDirectory.get().asFile
    )
    inputs.files(
            fileTree("${webRoot}/inference-rs") {
                include "Cargo.toml"
                include "Cargo.lock"
                include "build.rs"
                include "src/**"
                include "cpp/**"
            },
            rootProject.file("scripts/build-native.sh"),
            rootProject.file("KENLM_REVISION")
    )
    outputs.dir generatedNativeLibraries
}

tasks.register("buildSourceArchive", Exec) {
    dependsOn "prepareKenlm"
    dependsOn "prepareStrippedPlover"
    commandLine(
            rootProject.file("scripts/make-source-archive.sh"),
            webRoot,
            kenlmRoot.get().asFile,
            strippedPloverRoot.get().asFile,
            generatedSourceArchive.get().asFile
    )
    inputs.files(
            fileTree(webRoot) {
                exclude ".git/**"
                exclude "**/build/**"
                exclude "**/.gradle/**"
                exclude "**/node_modules/**"
                exclude "**/target/**"
                exclude "static/script.js"
                exclude "lm.binary"
                exclude "kenlm/**"
            },
            fileTree(strippedPloverRoot) {
                exclude ".git/**"
                exclude "node_modules/**"
                exclude "dist/**"
            },
            rootProject.file("KENLM_REVISION")
    )
    outputs.file generatedSourceArchive
    // BUILD-SOURCE.md records the current Git revision and dirty state, which
    // are not fully represented by the source file snapshots.
    outputs.upToDateWhen { false }
}

tasks.named("preBuild").configure {
    dependsOn "syncWebUi"
    dependsOn "buildStrippedPloverWeb"
    dependsOn "buildNativeInference"
    dependsOn "buildSourceArchive"
}

dependencies {
    implementation "androidx.javascriptengine:javascriptengine:1.1.0"
    implementation "androidx.webkit:webkit:1.15.0"
    implementation "androidx.work:work-runtime:2.11.2"
    testImplementation "junit:junit:4.13.2"
}
